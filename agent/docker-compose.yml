name: edgeplane-edge
services:
  agent:
    build:
      context: ..
      dockerfile: agent/Dockerfile.edge
    environment:
      AGENT_MODE: container
      AGENT_ID: local-edge
      AGENT_NAME: local-edge
      ALLOW_PRIVATE_ORIGINS: 'true'
      MANAGEMENT_ALLOWED_CIDRS: ${MANAGEMENT_ALLOWED_CIDRS:-["127.0.0.0/8","::1/128","172.24.0.0/16"]}
      POP_PROMETHEUS_PORT: ${POP_PROMETHEUS_PORT:-9091}
      VARNISH_CACHE_SIZE: ${VARNISH_CACHE_SIZE:-1g}
      PUBLIC_PORT: ${PUBLIC_PORT:-8080}
      TLS_PORT: ${TLS_PORT:-8443}
    network_mode: host
    volumes: [edge-data:/tmp/cdn-sandbox]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:9443/ready")']
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  edge-data:
