# Edgeplane vhost: Golden
# Domains: golden.example.com
# Vhost ID: 00000000-0000-0000-0000-000000000001
upstream origin_00000000000000000000000000000001 {

    server 127.0.0.1:80 weight=1 max_fails=3 fail_timeout=10s;

    keepalive 32;
}
server {
    listen 80;

    server_name golden.example.com;

    access_log /var/log/nginx/cdn/metrics/00000000-0000-0000-0000-000000000001.log cdn_usage_plain buffer=64k flush=1s;





    real_ip_header X-Forwarded-For;

    real_ip_recursive on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    more_clear_headers "X-CDN-*";
    more_clear_input_headers "X-CDN-*";
    client_max_body_size 32m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    access_log /var/log/nginx/cdn/00000000-0000-0000-0000-000000000001/access.json.log cdn;
    error_log /var/log/nginx/cdn/00000000-0000-0000-0000-000000000001/error.log warn;




    limit_req zone=cdn_rate_200 burst=400 nodelay;
    limit_req_status 429;
    limit_req_dry_run off;


    # ACME HTTP-01 is served locally on every POP, before cache and origin routing.
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/lib/cdn-agent/acme-webroot;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "no-store" always;
    }
    location / {
        if ($request_method = PURGE) { return 405; }

        # Allowlist prevents ALL client X-CDN-* headers from entering the data plane.
        proxy_pass_request_headers off;

        proxy_set_header Accept $http_accept;

        proxy_set_header Accept-Encoding $http_accept_encoding;

        proxy_set_header Accept-Language $http_accept_language;

        proxy_set_header Authorization $http_authorization;

        proxy_set_header Cookie $http_cookie;

        proxy_set_header Content-Type $http_content_type;

        proxy_set_header Range $http_range;

        proxy_set_header If-Range $http_if_range;

        proxy_set_header If-Modified-Since $http_if_modified_since;

        proxy_set_header If-None-Match $http_if_none_match;

        proxy_set_header Cache-Control $http_cache_control;

        proxy_set_header Pragma $http_pragma;

        proxy_set_header User-Agent $http_user_agent;

        proxy_set_header Referer $http_referer;

        proxy_set_header Origin $http_origin;

        proxy_set_header Access-Control-Request-Method $http_access_control_request_method;

        proxy_set_header Access-Control-Request-Headers $http_access_control_request_headers;

        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-CDN-Vhost 00000000-0000-0000-0000-000000000001;
        proxy_set_header X-CDN-Policy fa6a05fb4d2c7491;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cdn_connection;
        proxy_pass $cdn_backend;

        proxy_http_version 1.1;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;


        add_header X-Served-By "edge-golden" always;
        add_header X-Request-ID $request_id always;

    }
}
server {
    listen 127.0.0.1:8080;
    server_name golden.example.com;
    location / {
        proxy_pass http://origin_00000000000000000000000000000001;
        proxy_http_version 1.1;
        proxy_set_header Connection $cdn_connection;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-CDN-Vhost '';
        proxy_set_header X-CDN-Policy '';
        proxy_set_header X-Forwarded-Host $host;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_verify off;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_hide_header X-CDN-Vhost;
    }
}
