apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdn-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: cdn-worker}
  template:
    metadata:
      labels: {app: cdn-worker}
    spec:
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: your-registry/cdn-supervisor:0.1.0
          command: [python, -m, app.workers.runner]
          envFrom:
            - configMapRef: {name: cdn-config}
            - secretRef: {name: cdn-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '2', memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}

      volumes:
        - name: tmp
          emptyDir: {}
