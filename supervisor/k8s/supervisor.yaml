apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdn-supervisor
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: cdn-supervisor}
  template:
    metadata:
      labels: {app: cdn-supervisor}
    spec:
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: supervisor
          image: your-registry/cdn-supervisor:0.1.0
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: cdn-config}
            - secretRef: {name: cdn-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '2', memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
