apiVersion: v1
kind: ConfigMap
metadata: {name: cdn-config}
data:
  ENVIRONMENT: production
  ADMIN_USERNAME: admin
  SUPERVISOR_PUBLIC_URL: https://cdn.example.net
  POWERDNS_CDN_ZONE: edge.example.net
  JOB_POLL_INTERVAL: '2'
---
apiVersion: v1
kind: Secret
metadata: {name: cdn-secrets}
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://cdn:REPLACE@postgres.example.net/cdn
  SECRET_KEY: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  MASTER_ENCRYPTION_KEY: REPLACE_WITH_BASE64_32_RANDOM_BYTES
  ADMIN_PASSWORD: REPLACE_WITH_AT_LEAST_12_CHARACTERS
---
apiVersion: v1
kind: Service
metadata: {name: cdn-supervisor}
spec:
  selector: {app: cdn-supervisor}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: cdn-supervisor}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: cdn-supervisor}
