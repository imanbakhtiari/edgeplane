[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "cdn-supervisor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["maxminddb>=2.6,<4", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "cryptography>=44", "jinja2>=3.1,<4", "psutil>=6", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2", "asyncssh>=2.19,<3", "argon2-cffi>=23", "dnspython>=2.7,<3", "python-multipart>=0.0.20", "PyYAML>=6,<7"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.9"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
