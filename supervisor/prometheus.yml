global:
  scrape_interval: 15s
  external_labels:
    plane: supervisor

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

# Agent Prometheus instances may remote-write to /api/v1/write when that receiver
# is exposed behind authenticated HTTPS. Do not expose port 9090 directly online.
