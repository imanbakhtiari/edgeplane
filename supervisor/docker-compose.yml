name: cdn
x-supervisor: &supervisor
  build:
    context: ..
    dockerfile: supervisor/Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://cdn:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/cdn
    ENVIRONMENT: ${ENVIRONMENT:-production}
    SUPERVISOR_PUBLIC_URL: ${SUPERVISOR_PUBLIC_URL:-https://localhost:8000}
  networks: [control]
  # Match the host group that owns the read-only 0640 SSH private key.
  group_add: ['${SUPERVISOR_SSH_KEY_GID:-1000}']
  volumes:
    - ./ssh_keys/edgeplane_ed25519:/run/secrets/edgeplane_ssh_key:ro
  extra_hosts:
    - host.docker.internal:host-gateway
  restart: unless-stopped
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: cdn
      POSTGRES_USER: cdn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [control]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U cdn -d cdn']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *supervisor
    command: [sh, -c, 'alembic upgrade head && python -m app.seed']
    restart: 'no'
    depends_on:
      postgres: {condition: service_healthy}
  supervisor:
    <<: *supervisor
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/ready")']
      interval: 10s
      timeout: 3s
      retries: 5
  worker:
    <<: *supervisor
    command: [python, -m, app.workers.runner]
    depends_on:
      migrate: {condition: service_completed_successfully}
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    networks: [control]
    restart: unless-stopped
volumes:
  postgres:
  prometheus:
networks:
  control:
